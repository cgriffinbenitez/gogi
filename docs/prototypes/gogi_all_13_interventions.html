<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOGI — All 13 Intervention Screens</title>
<style>
:root {
  --c-navy:#1F4E79; --c-blue:#2E75B6; --c-blue-light:#E6F1FB; --c-blue-mid:#B5D4F4;
  --c-green:#3B6D11; --c-green-light:#C6EFCE; --c-green-border:#9FE1CB;
  --c-amber:#BA7517; --c-amber-light:#FAEEDA;
  --c-red:#A32D2D; --c-red-light:#FCEBEB;
  --c-gray:#888780; --c-dark:#2C2C2A; --c-light:#F2F2F2;
  --c-border:#CCCCCC; --c-white:#FFFFFF; --c-yellow:#FFF3A3;
  --font-ui:system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-passage:Georgia,'Times New Roman',serif;
  --radius-md:10px; --radius-lg:14px;
  --shadow-card:0 1px 2px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--c-light);color:var(--c-dark);font-family:var(--font-ui);font-size:14px;line-height:1.5;}

/* Top nav */
.topnav{background:var(--c-navy);color:var(--c-white);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-0.3px;}
.brand-tag{font-size:11px;color:rgba(255,255,255,0.6);margin-left:8px;font-weight:400;}
.topnav-user{font-size:12px;color:rgba(255,255,255,0.78);}

/* Pattern selector bar */
.selector-bar{background:var(--c-white);border-bottom:1px solid var(--c-border);padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.selector-bar label{font-size:11px;color:var(--c-gray);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;}
.selector-bar select{font-family:var(--font-ui);font-size:13px;padding:7px 12px;border:1px solid var(--c-border);border-radius:var(--radius-md);background:var(--c-white);color:var(--c-dark);cursor:pointer;min-width:380px;}
.selector-bar .nav-btn{background:var(--c-navy);color:var(--c-white);border:none;padding:7px 12px;border-radius:var(--radius-md);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;}
.selector-bar .nav-btn:hover{background:#163C60;}
.selector-bar .nav-btn:disabled{opacity:0.4;cursor:default;}
.selector-bar .counter{font-size:11px;color:var(--c-gray);font-family:ui-monospace,'SF Mono',Menlo,monospace;}

/* Page */
.page{max-width:860px;margin:0 auto;padding:22px 24px 60px;}

/* Route indicator */
.route-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;font-size:11px;flex-wrap:wrap;gap:8px;}
.route-code{color:var(--c-gray);font-family:ui-monospace,'SF Mono',Menlo,monospace;}
.route-code b{color:var(--c-navy);font-weight:600;}
.gap-badge{color:var(--c-gray);}
.gap-badge b{color:var(--c-dark);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600;}

/* Card */
.card{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:22px 26px;margin-bottom:14px;}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;}
.card-code{font-size:11px;color:var(--c-gray);font-weight:500;margin-bottom:3px;letter-spacing:0.04em;}
.card-name{font-size:17px;font-weight:700;color:var(--c-dark);letter-spacing:-0.3px;}
.card-pills{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:9999px;font-size:10px;font-weight:700;letter-spacing:0.04em;border:1px solid transparent;white-space:nowrap;}
.pill-layer-1{background:var(--c-amber-light);border-color:var(--c-amber);color:var(--c-amber);}
.pill-layer-2{background:var(--c-blue-light);border-color:var(--c-blue);color:var(--c-blue);}
.pill-layer-3{background:var(--c-green-light);border-color:var(--c-green);color:var(--c-green);}
.pill-status{background:var(--c-amber-light);border-color:var(--c-amber);color:var(--c-amber);}

/* Mini-lesson layout */
.lesson-stage{font-size:10.5px;color:var(--c-gray);font-weight:700;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px;}
.lesson-title{font-size:22px;font-weight:700;color:var(--c-dark);letter-spacing:-0.4px;margin:0 0 12px;}
.lesson-body{font-size:14.5px;line-height:1.65;color:var(--c-dark);margin:0 0 14px;}
.lesson-body i{font-style:normal;color:var(--c-navy);font-weight:600;}
.strategy-name{display:inline-block;background:var(--c-navy);color:var(--c-white);padding:6px 14px;border-radius:9999px;font-size:12px;font-weight:700;letter-spacing:0.02em;margin:4px 0 14px;}

/* Passage */
.passage{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:16px 20px;margin-bottom:16px;font-family:var(--font-passage);font-size:14.5px;line-height:1.75;color:var(--c-dark);max-height:280px;overflow-y:auto;}
.passage-title{font-family:var(--font-ui);font-size:10.5px;color:var(--c-gray);font-weight:700;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:10px;}
.passage p{margin:0 0 10px;}
.passage p:last-child{margin-bottom:0;}
.passage em{font-style:italic;}

.prompt{font-size:14.5px;line-height:1.55;color:var(--c-dark);margin-bottom:16px;font-weight:500;}
.prompt i{font-style:normal;color:var(--c-navy);font-weight:600;}

/* Gogi bubble */
.gogi{display:flex;align-items:flex-start;gap:12px;background:var(--c-blue-light);border:1px solid var(--c-blue-mid);border-radius:var(--radius-lg);padding:14px 16px;margin-top:14px;}
.gogi.engaged-wrap{background:var(--c-blue-light);}
.gogi-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--c-white);font-weight:700;font-size:14px;flex-shrink:0;}
.gogi-av.neutral{background:var(--c-navy);box-shadow:0 0 0 3px var(--c-blue-mid);}
.gogi-av.engaged{background:var(--c-blue);box-shadow:0 0 0 3px var(--c-blue-mid);}
.gogi-av.celebrate{background:var(--c-green);box-shadow:0 0 0 3px var(--c-green-border);}
.gogi-body{flex:1;}
.gogi-name{font-size:11px;font-weight:700;letter-spacing:0.04em;color:var(--c-navy);margin-bottom:4px;}
.gogi.celebrate-wrap .gogi-name{color:var(--c-green);}
.gogi-say{font-size:13.5px;line-height:1.6;color:var(--c-dark);margin:0;}
.gogi-say i{color:var(--c-navy);font-style:normal;font-weight:600;}

/* Buttons */
.btn{background:var(--c-navy);color:var(--c-white);border:none;padding:10px 18px;border-radius:var(--radius-md);font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer;letter-spacing:-0.1px;transition:background 120ms;}
.btn:hover{background:#163C60;}
.btn:disabled{opacity:0.4;cursor:default;}
.btn-green{background:var(--c-green);}
.btn-green:hover{background:#2A5008;}
.btn-ghost{background:transparent;color:var(--c-gray);border:1px solid var(--c-border);padding:7px 14px;border-radius:var(--radius-md);font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px;}
.btn-ghost:hover{background:var(--c-light);color:var(--c-dark);}
.action-row{display:flex;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--c-border);}

/* ============ DIAGRAM 1: Says → Means (2 boxes w/ arrow) ============ */
.diag-arrows{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:18px 20px;}
.diag-arrows .box{background:var(--c-white);border:1.5px solid var(--c-border);border-radius:var(--radius-md);padding:14px 16px;min-height:70px;display:flex;flex-direction:column;justify-content:center;}
.diag-arrows .box.filled{background:var(--c-blue-light);border-color:var(--c-blue);}
.diag-arrows .lbl{font-size:10px;font-weight:700;letter-spacing:0.12em;color:var(--c-gray);text-transform:uppercase;margin-bottom:6px;}
.diag-arrows .box.filled .lbl{color:var(--c-blue);}
.diag-arrows .content{font-family:var(--font-passage);font-size:14px;line-height:1.45;color:var(--c-dark);}
.diag-arrows .box.filled .content{color:var(--c-navy);font-weight:600;}
.diag-arrows .arrow{text-align:center;color:var(--c-navy);}
.diag-arrows .arrow-text{font-size:10px;color:var(--c-gray);font-family:var(--font-passage);font-style:italic;margin-bottom:4px;}
.diag-arrows .arrow-shape{font-size:22px;color:var(--c-navy);font-weight:700;}
@media (max-width:560px){.diag-arrows{grid-template-columns:1fr;}.diag-arrows .arrow{transform:rotate(90deg);}}

/* ============ DIAGRAM 2: Predict → Verify (two columns) ============ */
.diag-predict{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.diag-predict h4{margin:0 0 8px;font-size:10px;letter-spacing:0.12em;color:var(--c-gray);text-transform:uppercase;font-weight:700;}
.predict-tile{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:9px 12px;font-size:12.5px;margin-bottom:6px;cursor:pointer;}
.predict-tile.picked{background:var(--c-blue-light);border-color:var(--c-blue);color:var(--c-navy);font-weight:600;}
.predict-tile .mark{font-size:10px;font-weight:700;margin-right:6px;padding:2px 6px;border-radius:4px;}
.predict-tile.verified-yes .mark{background:var(--c-green-light);color:var(--c-green);}
.predict-tile.verified-no .mark{background:var(--c-red-light);color:var(--c-red);}
@media (max-width:560px){.diag-predict{grid-template-columns:1fr;}}

/* ============ DIAGRAM 3: Frayer (4 quadrants) ============ */
.diag-frayer{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;position:relative;background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:6px;}
.fq{background:var(--c-white);border:1.5px solid var(--c-border);border-radius:var(--radius-md);padding:12px 14px;min-height:90px;cursor:pointer;transition:all 150ms;}
.fq:hover{border-color:var(--c-blue);}
.fq.active{border-color:var(--c-blue);background:var(--c-blue-light);}
.fq-lab{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:var(--c-gray);font-weight:700;margin-bottom:8px;}
.fq.active .fq-lab{color:var(--c-blue);}
.fq.filled .fq-lab{color:var(--c-navy);}
.fq-content{font-family:var(--font-passage);font-size:12.5px;line-height:1.4;color:var(--c-dark);}
.fq.filled{background:var(--c-blue-light);border-color:var(--c-blue);}
.fq-word{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--c-navy);color:var(--c-white);font-family:var(--font-passage);font-size:16px;font-weight:700;padding:6px 16px;border-radius:9999px;box-shadow:0 2px 8px rgba(31,78,121,0.3);letter-spacing:1px;}
@media (max-width:560px){.diag-frayer{grid-template-columns:1fr;grid-template-rows:auto;}.fq-word{position:static;transform:none;display:inline-block;margin:8px auto;}}

/* ============ DIAGRAM 4: Split → Meaning (morpheme) ============ */
.diag-split{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:20px 18px;text-align:center;}
.split-word{display:inline-flex;gap:4px;align-items:center;font-family:var(--font-passage);font-size:24px;font-weight:400;color:var(--c-navy);margin-bottom:16px;}
.split-word .seg{padding:6px 12px;background:var(--c-white);border:1.5px solid var(--c-blue);border-radius:8px;}
.split-word .dash{color:var(--c-gray);font-size:18px;}
.split-meanings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.split-meaning{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:10px 12px;font-size:12px;color:var(--c-dark);min-height:60px;display:flex;flex-direction:column;justify-content:center;}
.split-meaning.filled{background:var(--c-blue-light);border-color:var(--c-blue);color:var(--c-navy);font-weight:600;}
.split-meaning .mini{font-size:9px;color:var(--c-gray);letter-spacing:0.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px;}

/* ============ DIAGRAM 5: Strip to Core (sentence segments) ============ */
.diag-strip{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:20px 22px;font-family:var(--font-passage);font-size:16.5px;line-height:2;color:var(--c-dark);}
.sseg{display:inline;padding:3px 6px;border-radius:4px;cursor:pointer;border:1px solid transparent;transition:all 120ms;margin-right:2px;}
.sseg.core{color:var(--c-green);font-weight:700;background:var(--c-green-light);border-color:var(--c-green);cursor:default;}
.sseg:hover:not(.core){background:var(--c-blue-light);color:var(--c-blue);}
.sseg.stripped{text-decoration:line-through;opacity:0.35;background:transparent;}

/* ============ DIAGRAM 6: Real or Trick (figurative tag) ============ */
.diag-tag{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:14px 16px;display:flex;flex-direction:column;gap:6px;}
.tag-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:10px 14px;}
.tag-phrase{font-family:var(--font-passage);font-size:13.5px;color:var(--c-dark);line-height:1.5;}
.tag-btns{display:flex;gap:4px;}
.tag-btn{padding:5px 10px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;border:1px solid var(--c-border);background:var(--c-white);color:var(--c-gray);text-transform:uppercase;letter-spacing:0.05em;}
.tag-btn.on-real{background:var(--c-green-light);border-color:var(--c-green);color:var(--c-green);}
.tag-btn.on-trick{background:var(--c-amber-light);border-color:var(--c-amber);color:var(--c-amber);}

/* ============ DIAGRAM 7: Mood Grid (2D) ============ */
.diag-mood{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:14px 18px;display:flex;justify-content:center;}
.mood-grid{position:relative;width:260px;height:260px;background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
.mood-cell{border:1px solid var(--c-light);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:var(--c-gray);font-weight:600;text-align:center;padding:8px;transition:all 120ms;}
.mood-cell:hover{background:var(--c-blue-light);color:var(--c-blue);}
.mood-cell.picked{background:var(--c-blue-light);color:var(--c-navy);font-weight:700;}
.mood-cell.modeled{background:var(--c-blue-light);color:var(--c-navy);font-weight:700;}
.mood-marker{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c-navy);box-shadow:0 0 0 4px var(--c-blue-mid);pointer-events:none;transform:translate(-50%,-50%);}
.mood-axis-x{position:absolute;bottom:-20px;left:0;right:0;display:flex;justify-content:space-between;font-size:10px;color:var(--c-gray);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;}
.mood-axis-y{position:absolute;top:0;bottom:0;left:-54px;display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--c-gray);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;align-items:flex-end;}
.mood-wrap{position:relative;padding:0 0 24px 60px;}

/* ============ DIAGRAM 8: Tone Wheel ============ */
.diag-wheel{display:flex;justify-content:center;padding:10px 0 4px;background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);}
.wheel{width:280px;height:280px;}
.wheel path{cursor:pointer;transition:opacity 0.2s;}
.wheel path:hover{opacity:0.82;}
.wheel text{pointer-events:none;font-family:var(--font-ui);font-weight:600;font-size:12px;}

/* ============ DIAGRAM 9: Track the Pair (character map) ============ */
.diag-pair{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:22px 18px;display:flex;align-items:center;justify-content:center;gap:14px;}
.char-circle{width:84px;height:84px;border-radius:50%;background:var(--c-white);border:2px solid var(--c-blue);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;flex-shrink:0;}
.char-name{font-family:var(--font-passage);font-size:14px;font-weight:700;color:var(--c-navy);}
.char-sub{font-size:9.5px;color:var(--c-gray);}
.pair-line{flex:1;min-width:60px;text-align:center;position:relative;}
.pair-line::before{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:var(--c-blue-mid);z-index:0;}
.pair-label{position:relative;display:inline-block;background:var(--c-blue-light);border:1.5px solid var(--c-blue);color:var(--c-navy);padding:6px 12px;border-radius:9999px;font-size:11.5px;font-weight:600;z-index:1;}
.pair-label.empty{background:var(--c-white);border-style:dashed;border-color:var(--c-border);color:var(--c-gray);font-weight:500;}

/* ============ DIAGRAM 10: Topic vs Theme (bins) ============ */
.diag-bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:14px;}
.bin{background:var(--c-white);border:1.5px solid var(--c-border);border-radius:var(--radius-md);padding:12px 14px;min-height:130px;}
.bin.topic{border-color:var(--c-amber);}
.bin.theme{border-color:var(--c-green);}
.bin-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;margin-bottom:4px;}
.bin.topic .bin-label{color:var(--c-amber);}
.bin.theme .bin-label{color:var(--c-green);}
.bin-sub{font-size:10.5px;color:var(--c-gray);margin-bottom:10px;font-style:italic;}
.bin-card{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:8px 12px;font-size:12px;margin-bottom:6px;cursor:pointer;line-height:1.45;}
.bin.topic .bin-card{background:var(--c-amber-light);border-color:var(--c-amber);color:#7A4D0E;}
.bin.theme .bin-card{background:var(--c-green-light);border-color:var(--c-green);color:#254509;}
.bin-bank-title{font-size:10.5px;color:var(--c-gray);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin:12px 0 6px;}
.bin-bank{display:flex;flex-direction:column;gap:6px;}
.bin-chip{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:8px 12px;font-size:12px;line-height:1.45;color:var(--c-dark);cursor:pointer;transition:all 120ms;}
.bin-chip:hover{background:var(--c-light);}
.bin-chip.used{opacity:0.35;pointer-events:none;}

/* ============ DIAGRAM 11: Find the Proof ============ */
.diag-proof{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:16px 18px;}
.proof-claim{background:var(--c-amber-light);border:1.5px solid var(--c-amber);color:#7A4D0E;border-radius:var(--radius-md);padding:10px 14px;font-size:13px;margin-bottom:10px;font-weight:600;}
.proof-claim .mini{font-size:10px;color:var(--c-amber);letter-spacing:0.12em;text-transform:uppercase;font-weight:700;margin-bottom:4px;display:block;}
.proof-arrow{text-align:center;color:var(--c-gray);font-size:18px;padding:4px 0;}
.proof-passage{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:12px 14px;font-family:var(--font-passage);font-size:13.5px;line-height:1.8;}
.proof-sent{display:inline;padding:2px 4px;border-radius:3px;cursor:pointer;border:1px solid transparent;margin-right:2px;}
.proof-sent:hover{background:var(--c-blue-light);}
.proof-sent.picked{background:var(--c-green-light);border-color:var(--c-green);color:var(--c-green);font-weight:600;}
.proof-sent.wrong-pick{background:var(--c-red-light);border-color:var(--c-red);color:var(--c-red);}

/* ============ DIAGRAM 12: Claim → Evidence → Warrant (stacked) ============ */
.diag-cew{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:14px 16px;}
.cew-box{background:var(--c-white);border:1.5px solid var(--c-border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:6px;min-height:50px;}
.cew-box.filled{background:var(--c-blue-light);border-color:var(--c-blue);}
.cew-lab{font-size:10px;color:var(--c-gray);text-transform:uppercase;letter-spacing:0.12em;font-weight:700;margin-bottom:6px;}
.cew-box.filled .cew-lab{color:var(--c-blue);}
.cew-content{font-family:var(--font-passage);font-size:13px;line-height:1.5;color:var(--c-dark);}
.cew-box.filled .cew-content{color:var(--c-navy);font-weight:600;}
.cew-arrow{text-align:center;color:var(--c-navy);font-size:14px;padding:2px 0;}

/* ============ DIAGRAM 13: Lens → Sentence (SOAPSTone) ============ */
.diag-soap{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:14px 16px;}
.lens-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.lens{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:7px 12px;font-size:11px;font-weight:700;color:var(--c-dark);cursor:pointer;text-align:center;min-width:34px;}
.lens:hover{background:var(--c-blue-light);border-color:var(--c-blue);color:var(--c-blue);}
.lens.active{background:var(--c-blue);border-color:var(--c-blue);color:var(--c-white);box-shadow:0 2px 6px rgba(46,117,182,0.3);}
.lens-full{font-size:9px;color:var(--c-gray);font-weight:500;text-transform:uppercase;letter-spacing:0.04em;display:block;margin-top:2px;}
.lens.active .lens-full{color:rgba(255,255,255,0.85);}
.soap-passage{background:var(--c-white);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:12px 14px;font-family:var(--font-passage);font-size:13.5px;line-height:1.8;}
.soap-sent{display:inline;padding:2px 4px;border-radius:3px;cursor:pointer;border:1px solid transparent;margin-right:2px;}
.soap-sent:hover{background:var(--c-blue-light);}
.soap-sent.tagged{background:var(--c-blue-light);border-color:var(--c-blue);color:var(--c-blue);font-weight:600;}
.soap-sent.tagged::after{content:attr(data-tag);font-family:var(--font-ui);font-size:10px;color:var(--c-white);background:var(--c-blue);padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle;font-weight:700;}
.soap-sent.tagged-right{background:var(--c-green-light);border-color:var(--c-green);color:var(--c-green);}
.soap-sent.tagged-right::after{background:var(--c-green);}

/* Chip pattern (shared for many) */
.chip-bank{display:flex;flex-wrap:wrap;gap:7px;}
.chip{background:var(--c-white);border:1px solid var(--c-border);border-radius:9999px;padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--c-dark);transition:all 120ms ease-out;font-family:var(--font-ui);}
.chip:hover{border-color:var(--c-blue);background:var(--c-blue-light);color:var(--c-blue);}
.chip.used{opacity:0.4;pointer-events:none;}

/* Blanks (for patterns that use fill-in) */
.stem{background:var(--c-light);border:1px solid var(--c-border);border-radius:var(--radius-md);padding:14px 18px;font-family:var(--font-passage);font-size:14.5px;line-height:2;margin-bottom:14px;color:var(--c-dark);}
.stem-labels{display:flex;justify-content:space-between;font-family:var(--font-ui);font-size:10px;color:var(--c-gray);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:6px;}
.blank{display:inline-block;min-width:150px;padding:3px 12px 2px;margin:0 4px;border-bottom:2px dashed var(--c-border);color:var(--c-gray);cursor:pointer;text-align:center;font-family:var(--font-ui);font-size:13.5px;}
.blank.filled{background:var(--c-blue-light);border-bottom:2px solid var(--c-blue);border-radius:5px 5px 0 0;color:var(--c-blue);font-weight:600;}

@media (max-width:720px){
  .page{padding:16px 14px 40px;}
  .card{padding:18px 18px;}
  .selector-bar{padding:10px 14px;}
  .selector-bar select{min-width:240px;width:100%;}
}
</style>

  // 1 ===========================================================
  inferencing_literal: {

    passageTitle:'After Twenty Years — O. Henry',
    partOneBody:`Sometimes the author tells you something flat-out. Sometimes they don't — they leave clues and make you figure it out. That second part has a name: <i>inference</i>. You use what the text <i>says</i> to decide what it <i>means</i>.`,
    partOneBottom:`Every inferencing question you hit is this same move. Find what the text <i>says</i>. Decide what it <i>means</i>. Your brain fills the arrow between them — that's the reading work.`,

    modelDiagram:{ left:'walked away and sent another officer', right:'still cared about his old friend' },
    modelPassage:`<p>Bob read the note under the streetlamp. His hand began to tremble.</p>
<p><em>"Bob: I was at the appointed place on time. When you struck the match, I saw it was the face of the man wanted in Chicago. Somehow I couldn't do it myself, so I went around and got a plain-clothes man to do the job. — JIMMY."</em></p>`,
    modelThinkAloud:`Watch me work this one. The text <i>says</i> Jimmy walked away and sent another officer to do the arrest — straight out. Here's where my brain starts working. A cop walking away from an arrest is strange. His job is to make the arrest. But he didn't. If they'd been best friends for twenty years, walking away starts to <i>mean</i> something. He still cared about Bob — enough that he couldn't be the one to do it. The text never wrote that last part. I did. That's inferencing.`,
    guidePassage:`<p>"It sounds romantic," said the policeman. "Rather a long time between meets, though, it seems to me. Haven't you heard from your friend since you left?"</p>
<p>"Well, yes, for a time we corresponded," said the other. "But after a year or two we lost track of each other. You see, the West is a pretty big proposition, and I kept hustling around over it pretty lively. But I know Jimmy will meet me here if he's alive, for he always was the truest, stanchest old chap in the world. He'll never forget. I came a thousand miles to stand in this door tonight, and it's worth it if my old partner turns up."</p>`,
    guidePrompt:`Different moment in the same story. Bob is talking to the "cop" (who is actually Jimmy in disguise). What does Bob's speech <i>say</i>, and what does it <i>mean</i>?`,

  // 2 ===========================================================
  inferencing_schema: {

    moveShort:'Predict → Verify',
    standardCode:'ELA.9.R.1.1',
    standardLabel:'Pre-Reading',
    passageTitle:'The Gift of the Magi — O. Henry',
    partOneBody:`Your brain already knows things. Before you read, you can use what you know about the world to <i>predict</i> what might happen. Then you read and <i>verify</i> — did your prediction match?`,
    partOneBottom:`The predicting is the real work. Good readers are guessing the whole time they read — then checking. You're not cheating; you're thinking.`,

    modelPassage:`<p>One dollar and eighty-seven cents. That was all Della had. Three times she counted it. One dollar and eighty-seven cents. And the next day would be Christmas. Pennies saved one and two at a time by bulldozing the grocer and the vegetable man until one's cheeks burned with the silent imputation of parsimony. Della had two possessions in which she took a mighty pride — one was Jim's gold watch that had been his father's, and the other was Della's beautiful long hair.</p>`,
    modelThinkAloud:`Before I even finish reading, my brain starts predicting. I know this is a story about Christmas and a poor woman. What do I know about the world? Poor people can't buy expensive gifts. Christmas makes people desperate to give. She has two prized possessions — a watch that's Jim's, and her own hair. One of those is sellable. So I predict: <i>Della will sell her hair to buy Jim a Christmas gift.</i> Now when I read the next paragraph — boom, there it is. My prediction was close, and because I predicted it, I understand why she does it.`,
    modelPredictions:[
      { text:"Della will sell her hair to buy Jim a gift", verified:'yes' },

      { text:"Someone will get hurt", verified:'no' },
      { text:"Jim will also make a sacrifice", verified:'yes' }
    ],
    guidePassage:`<p>Out of the car and down the street, Della stopped in front of a sign that read "Mme. Sofronie. Hair Goods of All Kinds." One flight up Della ran, and collected herself, panting. "Will you buy my hair?" asked Della.</p>
<p>"I buy hair," said Madame. "Take yer hat off and let's have a sight at the looks of it." Down rippled the brown cascade. "Twenty dollars," said Madame, lifting the mass with a practised hand.</p>`,
    guidePrompt:`Now you try. Before reading what Della does with the money, <i>predict</i>. Pick the two predictions you think the story will verify.`,
    guideType:'predict-pick',
    guidePredictions:[
      { id:'p1', text:'Della buys Jim a gift related to his watch', verified:true },
      { id:'p2', text:'Della buys herself new clothes', verified:false },
      { id:'p3', text:'Della spends the twenty dollars quickly', verified:true },

    guideRightGogi:`Good predictions. <i>Della buys Jim something for his watch</i> — turns out to be a platinum chain. <i>Della spends it quickly</i> — she's been saving pennies and now she has twenty dollars, of course she moves fast. Your brain used what you know about love and urgency to guess what the story was going to do next. That's reading before you read.`,
    guideWrongGogi:`A couple of those don't fit. Think about what you know about Della so far. Is she the kind of person who'd buy herself clothes with this money? Is she the kind of person who regrets a sacrifice she made for someone she loves? Use what the story has already shown you.`
  },

  vocabulary_gap: {
    classification:'vocabulary_gap',
    route:'/teach/vocabulary',

    moveName:'The Word → Frayer move',
    moveShort:'Word → Frayer',
    standardCode:'ELA.9.R.1.1',
    standardLabel:'During Reading',
    passageTitle:'The Gift of the Magi — O. Henry',
    partOneBody:`A word isn't really yours until you can hold it from four sides. What it <i>means</i>. What it's <i>always</i> like. <i>Examples</i> of it. And things that look like it but <i>aren't</i> — non-examples. That's the four-quadrant move.`,
    partOneBottom:`When you meet a word you only half-know, fill all four quadrants and you own it for life.`,
    diagram:{ type:'frayer', word:'YOURWORD' },
    modelWord:'sacrifice',
    modelPassage:`<p>There was clearly nothing to do but flop down on the shabby little couch and howl. So Della did it. Suddenly she whirled from the window and stood before the glass. Her eyes were shining brilliantly, but her face had lost its color within twenty seconds. Rapidly she pulled down her hair and let it fall to its full length.</p>
<p>Now, there were two possessions of the James Dillingham Youngs in which they both took a mighty pride. One was Jim's gold watch that had been his father's and his grandfather's. The other was Della's hair.</p>`,
    modelThinkAloud:`Watch me own the word <i>sacrifice</i>. Definition: giving up something valuable for someone you love more. Characteristics: you have to <i>choose</i> it — an accident isn't a sacrifice. Examples in this story: Della is about to cut off the hair she's most proud of, to buy Jim a present. Non-examples: someone losing their wallet on the bus — that's a loss, not a sacrifice. Now when I hit the word <i>sacrifice</i> anywhere else, in any book, I have all four quadrants ready.`,
    modelFrayer:{

    guidePrompt:`Different moment in the same story. This time own the word <i>devotion</i>. Tap a quadrant and fill it in.`,

      { id:'ex', lab:'Examples' },
      { id:'ne', lab:'Non-examples' }

      { id:'c1', text:'Deep loyalty and love toward someone', home:'def' },
      { id:'c2', text:'Lasts even in hard or scary moments', home:'ch' },
      { id:'c3', text:'Della praying Jim still finds her pretty', home:'ex' },
      { id:'c4', text:'Sending a text you forget about', home:'ne' },
      { id:'c5', text:'A crush that fades in a week', home:'ne' },
      { id:'c6', text:'Shown through action, not just words', home:'ch' }

    guideRightGogi:`You just owned <i>devotion</i>. See how it's not the same as "like" or "crush"? Devotion is steady and shows up in what a person does when things are hard. Della whispering a prayer at her own door is devotion right there in the text.`,

  morphology_gap: {
    classification:'morphology_gap',

    layer:2,

    moveShort:'Split → Meaning',
    standardCode:'ELA.9.R.1.1',
    standardLabel:'During Reading',
    passageTitle:'The Furnished Room — O. Henry',
    partOneBody:`Big words are just smaller words stuck together. <i>Split</i> the word into its parts — the front (prefix), the middle (root), and the back (suffix). Each piece has its own <i>meaning</i>. Glue those meanings back together and the big word is suddenly yours.`,
    partOneBottom:`You don't need a dictionary. You already know pieces. Split, find the meanings, rebuild.`,
    diagram:{ type:'split', segs:['pre','root','suf'], meanings:['','',''] },

    modelThinkAloud:`Watch me split <i>unmerciful</i>. Three pieces: UN- at the front, MERCI in the middle, -FUL at the end. UN- means "not" — I know that from <i>unhappy</i>, <i>unfair</i>. MERCI is the root — it means mercy, kindness. -FUL means "full of" — like <i>joyful</i> means full of joy. Glue it back: "not full of mercy." Unmerciful = merciless. I just read a big word without ever seeing it before.`,
    modelSplit:{ segs:['un','merci','ful'], meanings:['not','mercy','full of'] },

      { id:'m3', text:'past tense / done', home:'ed' },
      { id:'m4', text:'over / above' },
      { id:'m5', text:'before' },
      { id:'m6', text:'same as' }
    ],
    guideRightGogi:`Now glue the meanings back: "not / set up with furniture / done." An <i>unfurnished</i> room is one that has NOT been set up with furniture. You just unlocked a word with no dictionary — that's the whole move.`,
    guideWrongGogi:`Check each piece. UN- shows up in words like "unhappy" — what does it do? -ED shows up on "walked" or "jumped" — what does it do? Try again.`
  },

  // 5 ===========================================================
  syntax_barrier: {
    classification:'syntax_barrier',
    route:'/teach/syntax',
    layer:2,
    moveName:'The Strip to Core move',
    moveShort:'Strip to Core',
    standardCode:'ELA.9.R.1.1',
    standardLabel:'During Reading',
    passageTitle:'The Furnished Room — O. Henry',
    partOneBody:`Long sentences look scary. They're not — they're just a short sentence with extra decorations. <i>Strip</i> the extras. What's left is the <i>core</i>: who did what. Once you see the core, the decorations make sense.`,
    partOneBottom:`Every long sentence has a short sentence hiding inside. Your job is to find it.`,
    diagram:{ type:'strip', demo:'[ subject ] [ verb ] [ object ] ← with extras stripped away' },
    modelSentence:'Upon the worn carpet, where hundreds had walked, the young man, tired and defeated, placed his heavy suitcase.',
    modelThinkAloud:`Watch me strip this. "Upon the worn carpet" — that's a WHERE, not the main action. Cross it. "Where hundreds had walked" — that describes the carpet. Extra. Cross it. "Tired and defeated" — that describes the young man. Extra. Cross it. "Heavy" — describes the suitcase. Extra. What's left? <i>The young man placed his suitcase.</i> That's the core. Now I read the decorations back in and I get the full picture.`,

      { text:'suitcase.', role:'core' }

    guidePrompt:`Different sentence from the same story. Tap the modifiers to strike them out. Leave the subject-verb core alone.`,
    guideType:'strip-interactive',
    guideSegs:[
      { id:'a', text:'Within the hour,', role:'mod' },
      { id:'b', text:'drifting from some room below,', role:'mod' },
      { id:'c', text:'a scent', role:'core' },
      { id:'d', text:'of mignonette,', role:'mod' },
      { id:'e', text:'her favorite flower,', role:'mod' },
      { id:'f', text:'reached', role:'core' },
      { id:'g', text:'his', role:'core' },
      { id:'h', text:'bewildered', role:'mod' },
      { id:'i', text:'nostrils.', role:'core' }
    ],
    guideRightGogi:`What's left is the core: <i>a scent reached his nostrils</i>. Everything you stripped was the author decorating — <i>when</i>, <i>from where</i>, <i>what kind of scent</i>, <i>whose flower</i>, <i>how he felt</i>. Now you can add them back in one at a time and the long sentence is easy.`,

  // 6 ===========================================================
  figurative_language_failure: {
    classification:'figurative_language_failure',
    route:'/teach/figurative',
    layer:2,
    moveName:'The Real or Trick move',
    moveShort:'Real or Trick?',
    standardCode:'ELA.9.R.1.1',
    standardLabel:'During Reading',
    passageTitle:'The Furnished Room — O. Henry',
    partOneBody:`Some sentences mean exactly what they say. <i>Real.</i> Some sentences are the author pulling a trick — a metaphor, a simile, personification. <i>Trick.</i> The question to ask every time: "Could this <i>literally</i> be true?"`,
    partOneBottom:`If it can literally be true, it's real. If it can't, the author is showing you something another way. That's figurative language.`,
    diagram:{ type:'tag' },
    modelPhrases:[
      { text:'The carpet lay like a lawn of matted, worn-out weeds.', answer:'trick', why:'Simile — "like." A carpet isn\'t a lawn.' },
      { text:'He carried a worn leather suitcase.', answer:'real', why:'Could literally be true.' },
      { text:'The house was a tomb of broken dreams.', answer:'trick', why:'Metaphor. A house isn\'t a literal tomb.' }
    ],
    modelThinkAloud:`Watch me tag these. "The carpet lay like a lawn of matted weeds." Could a carpet literally be a lawn? No. The word <i>like</i> is the tell — that's a simile. TRICK. "He carried a worn leather suitcase." Could someone literally carry a worn suitcase? Yes. REAL. "The house was a tomb of broken dreams." Could a house literally be a tomb? No — houses aren't graves. TRICK. One question, three tags.`,
    guidePassage:`<p>The room was in a mood — a sort of sullen gloom that hung about the place like a wet cloak. Faded roses on the wallpaper watched him with tired eyes. A mirror above the dresser caught his reflection clearly in the dim light, showing a young man not yet thirty.</p>`,
    guidePrompt:`Different paragraph of the same story. Tag each phrase — Real or Trick?`,
    guideType:'tag-interactive',
    guidePhrases:[
      { id:'t1', text:'The room was in a mood.', answer:'trick' },
      { id:'t2', text:'A sullen gloom hung about the place like a wet cloak.', answer:'trick' },
      { id:'t3', text:'Faded roses on the wallpaper watched him with tired eyes.', answer:'trick' },
      { id:'t4', text:'A mirror above the dresser caught his reflection.', answer:'real' }
    ],
    guideRightGogi:`Three tricks, one real. <i>Rooms don't have moods</i> (personification). <i>Gloom isn't a cloak</i> (simile). <i>Roses on wallpaper don't have eyes</i> (personification). But a mirror literally catches a reflection — that's what mirrors do. That's the move.`,
    guideWrongGogi:`Ask the one question: could this literally be true? Can roses on wallpaper actually have eyes? Can a gloom actually be a cloak? Try again.`
  },

  // 7 ===========================================================
  mood_misreading: {
    classification:'mood_misreading',
    route:'/teach/mood',
    layer:3,
    moveName:'The Plot the Mood move',
    moveShort:'Plot the Mood',
    standardCode:'ELA.9.R.1.1',
    standardLabel:'After Reading',
    passageTitle:'The Furnished Room — O. Henry',
    partOneBody:`Every passage has a mood — the feeling the words give you. Two questions get you there: Is it <i>dark</i> or <i>bright</i>? Is it <i>tense</i> or <i>calm</i>? Plot those two answers on a grid and you have the mood.`,
    partOneBottom:`Same story can shift moods between paragraphs. Your job is to read what's on the page — word choices, images, action — and plot where the author put you.`,
    diagram:{ type:'mood' },
    modelPassage:`<p>Restless, shifting, fugacious as time itself is a certain vast bulk of the population of the red brick district of the lower West Side. Homeless, they have a hundred homes. They flit from furnished room to furnished room, transients forever — transients in abode, transients in heart and mind. They sing "Home, Sweet Home" in ragtime; they carry their <em>lares et penates</em> in a bandbox; their vine is entwined about a picture hat; a rubber plant is their fig tree.</p>`,
    modelThinkAloud:`Plot this paragraph. Dark or bright? Dark — "homeless," "transients," "lower West Side," "restless." Tense or calm? Not urgent-tense but uneasy — drifting, never settled, no real home. So I plot: dark-leaning, calm-leaning but hollow. Lower-left area. That's the mood — heavy, unsettled, sad without being loud.`,
    modelMoodPick:'dark-calm',
    guidePassage:`<p>He sprang up and turned on the gas. He sprang to the wall, pulled out a drawer, and laid bare an old mattress covered with a dust of dead roaches. At the hall closet he paused with his hand on the knob. Then he went in and turned the gas on full. He lay down upon the bed and did not move. And the gas sighed and hummed and the mattress crackled softly as he shifted his weight.</p>`,
    guidePrompt:`Different moment in the same story. Where does the mood of <i>this</i> paragraph land on the grid?`,
    guideType:'mood-pick',
    guideTarget:'dark-tense',

function cardHeader(p, title){
  const layerLabel = { 1:'L1 · PRE-READING', 2:'L2 · DURING READING', 3:'L3 · AFTER READING' }[p.layer];
  const layerCls = `pill-layer-${p.layer}`;
  return `
    <div class="card-header">
      <div>
        <div class="card-code">${p.standardCode} · ${p.standardLabel}</div>
        <div class="card-name">${title}</div>
      </div>
      <div class="card-pills">
        <span class="pill ${layerCls}">${layerLabel}</span>
        <span class="pill pill-status">In Intervention</span>
      </div>
    </div>
  `;
}
function gogiBubble(state, msg){
  const wrapCls = state === 'celebrate' ? 'celebrate-wrap' : '';
  return `<div class="gogi ${wrapCls}"><div class="gogi-av ${state}">G</div><div class="gogi-body"><div class="gogi-name">Gogi</div><p class="gogi-say">${msg}</p></div></div>`;
}

// PART 1 DIAGRAMS (one per pattern)

function renderPartOneDiagram(p){
  switch(p.diagram.type){
    case 'arrows':
      return `<div class="diag-arrows">
        <div class="box"><div class="lbl">${p.diagram.leftLabel}</div><div class="content">${p.diagram.leftText}</div></div>
        <div class="arrow"><div class="arrow-text">${p.diagram.arrowText}</div><div class="arrow-shape">→</div></div>
        <div class="box"><div class="lbl">${p.diagram.rightLabel}</div><div class="content">${p.diagram.rightText}</div></div>
      </div>`;
    case 'predict':
      return `<div class="diag-predict">
        <div><h4>${p.diagram.leftLabel}</h4>
          <div class="predict-tile">• possible outcome #1</div>
          <div class="predict-tile">• possible outcome #2</div>
          <div class="predict-tile">• possible outcome #3</div>
        </div>
        <div><h4>${p.diagram.rightLabel}</h4>
          <div class="predict-tile"><span class="mark">?</span>did this happen?</div>
          <div class="predict-tile"><span class="mark">?</span>did this happen?</div>
          <div class="predict-tile"><span class="mark">?</span>did this happen?</div>
        </div>
      </div>`;
    case 'frayer':
      return `<div class="diag-frayer">
        <div class="fq"><div class="fq-lab">Definition</div></div>
        <div class="fq"><div class="fq-lab">Characteristics</div></div>
        <div class="fq"><div class="fq-lab">Examples</div></div>
        <div class="fq"><div class="fq-lab">Non-examples</div></div>
        <div class="fq-word">YOUR WORD</div>
      </div>`;
    case 'split':
      return `<div class="diag-split">
        <div class="split-word">
          <span class="seg">pre-</span><span class="dash">+</span><span class="seg">root</span><span class="dash">+</span><span class="seg">-suf</span>
        </div>
        <div class="split-meanings">
          <div class="split-meaning"><div class="mini">Prefix</div>meaning</div>
          <div class="split-meaning"><div class="mini">Root</div>meaning</div>
          <div class="split-meaning"><div class="mini">Suffix</div>meaning</div>
        </div>
      </div>`;
    case 'strip':
      return `<div class="diag-strip" style="text-align:center;">
        <span class="sseg stripped">[extra]</span>
        <span class="sseg core">the subject</span>
        <span class="sseg core">did</span>
        <span class="sseg core">something.</span>
        <span class="sseg stripped">[extra]</span>
      </div>`;
    case 'tag':
      return `<div class="diag-tag">
        <div class="tag-row"><div class="tag-phrase">A phrase that means what it says.</div><div class="tag-btns"><div class="tag-btn on-real">Real</div></div></div>
        <div class="tag-row"><div class="tag-phrase">A phrase that's pulling a trick.</div><div class="tag-btns"><div class="tag-btn on-trick">Trick</div></div></div>
      </div>`;
    case 'mood':
      return `<div class="diag-mood"><div class="mood-wrap"><div class="mood-grid">
        <div class="mood-cell">DARK<br>TENSE</div>
        <div class="mood-cell">BRIGHT<br>TENSE</div>
        <div class="mood-cell">DARK<br>CALM</div>
        <div class="mood-cell">BRIGHT<br>CALM</div>
      </div>
      <div class="mood-axis-y"><span>TENSE</span><span>CALM</span></div>
      <div class="mood-axis-x"><span>DARK</span><span>BRIGHT</span></div>
      </div></div>`;
    case 'wheel':
      return renderWheel(null, null, true);
    case 'pair':
      return `<div class="diag-pair">
        <div class="char-circle"><div class="char-name">Person A</div></div>
        <div class="pair-line"><div class="pair-label empty">relationship?</div></div>
        <div class="char-circle"><div class="char-name">Person B</div></div>
      </div>`;
    case 'bins':
      return `<div class="diag-bins">
        <div class="bin topic"><div class="bin-label">Topic</div><div class="bin-sub">a word or phrase</div><div class="bin-card">Christmas</div><div class="bin-card">sacrifice</div></div>
        <div class="bin theme"><div class="bin-label">Theme</div><div class="bin-sub">a full claim about life</div><div class="bin-card">Love is shown in what we give up.</div></div>
      </div>`;
    case 'proof':
      return `<div class="diag-proof">
        <div class="proof-claim"><span class="mini">Claim</span>What you're saying about the story.</div>
        <div class="proof-arrow">↓</div>
        <div class="proof-passage">
          <span class="proof-sent">A sentence that doesn't prove it.</span>
          <span class="proof-sent picked">The exact sentence that proves it.</span>
          <span class="proof-sent">Another sentence.</span>

function renderWheel(pickedTone, highlightTone, blank){
  const tones = [
    { id:'sardonic', label:'Sardonic', fill:'#DCD7F5', stroke:'#6d28d9' },
    { id:'earnest',  label:'Earnest',  fill:'#C6EFCE', stroke:'#3B6D11' },
    { id:'bitter',   label:'Bitter',   fill:'#FCEBEB', stroke:'#A32D2D' },
    { id:'playful',  label:'Playful',  fill:'#FAEEDA', stroke:'#BA7517' },
    { id:'solemn',   label:'Solemn',   fill:'#E8E8E4', stroke:'#888780' },
    { id:'warm',     label:'Warm',     fill:'#E6F1FB', stroke:'#2E75B6' }
  ];
  const paths = [
    'M 150 150 L 150 24 A 126 126 0 0 1 259.12 87 Z',
    'M 150 150 L 259.12 87 A 126 126 0 0 1 259.12 213 Z',
    'M 150 150 L 259.12 213 A 126 126 0 0 1 150 276 Z',
    'M 150 150 L 150 276 A 126 126 0 0 1 40.88 213 Z',
    'M 150 150 L 40.88 213 A 126 126 0 0 1 40.88 87 Z',
    'M 150 150 L 40.88 87 A 126 126 0 0 1 150 24 Z'
  ];
  const lbl = [[192,82],[235,150],[192,218],[108,218],[65,150],[108,82]];
  const onClick = blank ? '' : (pickedTone === undefined ? 'onclick="tonePick(\'__ID__\')"' : '');
  let svg = '<div class="diag-wheel"><svg class="wheel" viewBox="0 0 300 300">';
  tones.forEach((t,i) => {
    const sel = highlightTone === t.id;
    const dim = highlightTone && !sel;
    const click = blank ? '' : `onclick="tonePick('${t.id}')"`;
    svg += `<path d="${paths[i]}" fill="${t.fill}" stroke="${t.stroke}" stroke-width="${sel?2.5:1.5}" opacity="${dim?0.3:1}" ${click}/>`;
  });
  tones.forEach((t,i) => {
    svg += `<text x="${lbl[i][0]}" y="${lbl[i][1]+4}" fill="${t.stroke}" text-anchor="middle">${t.label}</text>`;
  });
  svg += '</svg></div>';
  return svg;
}

window.pickChipStem = (key, val) => {
  const s = ls[key];
  s.blanks = s.blanks || [null,null];
  if(!s.blanks[0]) s.blanks[0] = val;
  else if(!s.blanks[1]) s.blanks[1] = val;
  render();
};
window.clearBlankStem = (key, idx) => {
  const s = ls[key];
  if(!s.blanks) return;
  if(s.submitted) return;
  s.blanks[idx] = null;
  render();
};
window.submitChipStem = (key) => { ls[key].submitted = true; render(); };
window.retryChipStem = (key) => { ls[key].blanks = [null,null]; ls[key].submitted = false; render(); };

function renderPart3_chipStem(p){
  const key = p.classification;
  const s = ls[key];
  const b0 = (s.blanks||[null,null])[0], b1 = (s.blanks||[null,null])[1];
  const filled = b0 && b1;
  const correct = filled && p.guideCorrect.includes(b0) && p.guideCorrect.includes(b1) && b0 !== b1;
  const showGogi = !!s.submitted;
  return `
    <div class="passage"><div class="passage-title">${p.passageTitle} — different moment</div>${p.guidePassage}</div>
    <div class="prompt">${p.guidePrompt}</div>
    <div class="stem">
      <div class="stem-labels"><span>${p.guideStem.leftLbl}</span><span>${p.guideStem.rightLbl}</span></div>
      The text says <span class="blank ${b0?'filled':''}" onclick="clearBlankStem('${key}',0)">${b0||'&nbsp;'}</span>. That makes me think <span class="blank ${b1?'filled':''}" onclick="clearBlankStem('${key}',1)">${b1||'&nbsp;'}</span>.
    </div>
    <div class="chip-bank">
      ${p.guideChips.map(c => {
        const used = b0===c || b1===c;
        return `<div class="chip ${used?'used':''}" onclick="pickChipStem('${key}','${c.replace(/'/g,"\\'")}')">${c}</div>`;
      }).join('')}
    </div>
    ${showGogi ? gogiBubble(correct?'celebrate':'neutral', correct?p.guideRightGogi:p.guideWrongGogi) : ''}
    <div class="action-row">
      ${!s.submitted ? `<button class="btn" ${!filled?'disabled':''} onclick="submitChipStem('${key}')">Check my work</button>` : (correct ? `<button class="btn btn-green">I've got it →</button>` : `<button class="btn-ghost" onclick="retryChipStem('${key}')">Clear and try again</button>`)}
    </div>`;
}

};

    <div class="diag-tag">
      ${p.guidePhrases.map(ph => `
        <div class="tag-row">
          <div class="tag-phrase">${ph.text}</div>
          <div class="tag-btns">
            <div class="tag-btn ${tags[ph.id]==='real'?'on-real':''}" onclick="tagPhrase('${key}','${ph.id}','real')">Real</div>
            <div class="tag-btn ${tags[ph.id]==='trick'?'on-trick':''}" onclick="tagPhrase('${key}','${ph.id}','trick')">Trick</div>
          </div>

    <div class="action-row">
      ${!s.submitted ? `<button class="btn" ${!allTagged?'disabled':''} onclick="submitTag('${key}')">Check my tags</button>` : (allRight ? `<button class="btn btn-green">I've got it →</button>` : `<button class="btn-ghost" onclick="retryTag('${key}')">Reset</button>`)}
    </div>`;
}

window.moodPick = (key, q) => {
  const s = ls[key]; if(s.submitted) return;
  s.pick = q; s.submitted = true; render();
};
window.retryMood = key => { ls[key].pick = null; ls[key].submitted = false; render(); };

  const key = p.classification;
  const s = ls[key];

  const correct = pick === p.guideTarget;
  const posMap = {
    'dark-tense':{x:'25%',y:'25%'}, 'bright-tense':{x:'75%',y:'25%'},

    <div class="action-row">
      ${s.submitted && !correct ? `<button class="btn-ghost" onclick="retryMood('${key}')">Try a different quadrant</button>` : (correct ? `<button class="btn btn-green">I've got it →</button>` : '')}

}

window.tonePick = (key, toneId) => {
  const s = ls[key]; if(s.submitted) return;
  s.tone = toneId; s.submitted = true; render();
};
window.retryTone = key => { ls[key].tone = null; ls[key].submitted = false; render(); };

function renderPart3_tonePick(p){
  const key = p.classification;
  const s = ls[key];
  const picked = s.tone;
  const correct = picked === p.guideTarget;
  const tones = [
    { id:'sardonic', label:'Sardonic', fill:'#DCD7F5', stroke:'#6d28d9' },
    { id:'earnest',  label:'Earnest',  fill:'#C6EFCE', stroke:'#3B6D11' },
    { id:'bitter',   label:'Bitter',   fill:'#FCEBEB', stroke:'#A32D2D' },
    { id:'playful',  label:'Playful',  fill:'#FAEEDA', stroke:'#BA7517' },
    { id:'solemn',   label:'Solemn',   fill:'#E8E8E4', stroke:'#888780' },
    { id:'warm',     label:'Warm',     fill:'#E6F1FB', stroke:'#2E75B6' }
  ];
  const paths = [
    'M 150 150 L 150 24 A 126 126 0 0 1 259.12 87 Z',
    'M 150 150 L 259.12 87 A 126 126 0 0 1 259.12 213 Z',
    'M 150 150 L 259.12 213 A 126 126 0 0 1 150 276 Z',
    'M 150 150 L 150 276 A 126 126 0 0 1 40.88 213 Z',
    'M 150 150 L 40.88 213 A 126 126 0 0 1 40.88 87 Z',
    'M 150 150 L 40.88 87 A 126 126 0 0 1 150 24 Z'
  ];
  const lbl = [[192,82],[235,150],[192,218],[108,218],[65,150],[108,82]];
  let svg = '<div class="diag-wheel"><svg class="wheel" viewBox="0 0 300 300">';
  tones.forEach((t,i) => {
    const sel = picked === t.id;
    const dim = picked && !sel;
    svg += `<path d="${paths[i]}" fill="${t.fill}" stroke="${t.stroke}" stroke-width="${sel?2.5:1.5}" opacity="${dim?0.3:1}" onclick="tonePick('${key}','${t.id}')"/>`;
  });
  tones.forEach((t,i) => { svg += `<text x="${lbl[i][0]}" y="${lbl[i][1]+4}" fill="${t.stroke}" text-anchor="middle">${t.label}</text>`; });
  svg += '</svg></div>';
  return `
    <div class="passage"><div class="passage-title">${p.passageTitle} — different moment</div>${p.guidePassage}</div>
    <div class="prompt">${p.guidePrompt}</div>
    ${svg}
    ${s.submitted ? gogiBubble(correct?'celebrate':'neutral', correct?p.guideRightGogi:p.guideWrongGogi) : ''}
    <div class="action-row">
      ${s.submitted && !correct ? `<button class="btn-ghost" onclick="retryTone('${key}')">Clear and try again</button>` : (correct ? `<button class="btn btn-green">I've got it →</button>` : '')}
    </div>`;
}

window.pairLabel = (key, labelId) => { ls[key].label = labelId; ls[key].submitted = true; render(); };
window.retryPair = key => { ls[key].label = null; ls[key].submitted = false; render(); };

function renderPart3_pairLabel(p){
  const key = p.classification;
  const s = ls[key];
  const picked = s.label;
  const chip = p.guideLabelChips.find(c => c.id === picked);
  const correct = picked === p.guideTarget;
  return `
    <div class="passage"><div class="passage-title">${p.passageTitle} — different moment</div>${p.guidePassage}</div>
    <div class="prompt">${p.guidePrompt}</div>
    <div class="diag-pair">
      <div class="char-circle"><div class="char-name">${p.guidePairA.name}</div><div class="char-sub">${p.guidePairA.sub}</div></div>
      <div class="pair-line"><div class="pair-label ${chip?'':'empty'}">${chip?chip.text:'pick a label →'}</div></div>
      <div class="char-circle"><div class="char-name">${p.guidePairB.name}</div><div class="char-sub">${p.guidePairB.sub}</div></div>
    </div>
    <div style="font-size:10.5px;color:var(--c-gray);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px;">Relationship label chips</div>
    <div class="chip-bank">
      ${p.guideLabelChips.map(c => `<div class="chip ${picked===c.id?'used':''}" onclick="pairLabel('${key}','${c.id}')">${c.text}</div>`).join('')}
    </div>
    ${s.submitted ? gogiBubble(correct?'celebrate':'neutral', correct?p.guideRightGogi:p.guideWrongGogi) : ''}
    <div class="action-row">
      ${s.submitted && !correct ? `<button class="btn-ghost" onclick="retryPair('${key}')">Try a different label</button>` : (correct ? `<button class="btn btn-green">I've got it →</button>` : '')}
    </div>`;
}

window.binSort = (key, id, bin) => {
  const s = ls[key]; s.sort = s.sort || {};
  if(s.submitted) return;
  s.sort[id] = bin;
  render();
};
window.submitBin = key => { ls[key].submitted = true; render(); };
window.retryBin = key => { ls[key].sort = {}; ls[key].submitted = false; render(); };

function renderPart3_binSort(p){
  const key = p.classification;
  const s = ls[key];
  const sort = s.sort || {};
  const allPlaced = p.guideCards.every(c => sort[c.id]);
  const allRight = allPlaced && p.guideCards.every(c => sort[c.id] === c.bin);
  const topicCards = p.guideCards.filter(c => sort[c.id] === 'topic');
  const themeCards = p.guideCards.filter(c => sort[c.id] === 'theme');
  const unplaced = p.guideCards.filter(c => !sort[c.id]);
  return `
    <div class="passage"><div class="passage-title">${p.passageTitle} — different moment</div>${p.guidePassage}</div>
    <div class="prompt">${p.guidePrompt}</div>
    <div class="diag-bins">
      <div class="bin topic"><div class="bin-label">Topic</div><div class="bin-sub">a word or phrase</div>
        ${topicCards.map(c => `<div class="bin-card">${c.text}</div>`).join('')}
      </div>
      <div class="bin theme"><div class="bin-label">Theme</div><div class="bin-sub">a full claim about life</div>
        ${themeCards.map(c => `<div class="bin-card">${c.text}</div>`).join('')}
      </div>
    </div>
    <div style="font-size:10.5px;color:var(--c-gray);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px;">Tap a card, then tap Topic or Theme</div>
    ${unplaced.map(c => `<div class="bin-chip" style="margin-bottom:6px;"><div style="font-size:12.5px;margin-bottom:6px;">${c.text}</div><div style="display:flex;gap:6px;"><button class="btn-ghost" style="margin:0;padding:4px 10px;font-size:11px;" onclick="binSort('${key}','${c.id}','topic')">Topic</button><button class="btn-ghost" style="margin:0;padding:4px 10px;font-size:11px;" onclick="binSort('${key}','${c.id}','theme')">Theme</button></div></div>`).join('')}
    ${s.submitted ? gogiBubble(allRight?'celebrate':'neutral', allRight?p.guideRightGogi:p.guideWrongGogi) : ''}
    <div class="action-row">
      ${!s.submitted ? `<button class="btn" ${!allPlaced?'disabled':''} onclick="submitBin('${key}')">Check my sort</button>` : (allRight ? `<button class="btn btn-green">I've got it →</button>` : `<button class="btn-ghost" onclick="retryBin('${key}')">Reset</button>`)}
    </div>`;
}

window.proofPick = (key, id) => { ls[key].pick = id; ls[key].submitted = true; render(); };
window.retryProof = key => { ls[key].pick = null; ls[key].submitted = false; render(); };

function renderPart3_proofPick(p){
  const key = p.classification;
  const s = ls[key];
  const picked = s.pick;
  const correct = picked === p.guideTarget;
  return `
    <div class="prompt" style="margin-top:8px;">${p.guidePrompt}</div>
    <div class="diag-proof">
      <div class="proof-claim"><span class="mini">Claim</span>${p.guideClaim}</div>
      <div class="proof-arrow">↓</div>
      <div class="proof-passage">
        ${p.guideSentences.map(sen => {
          let cls = 'proof-sent';
          if(picked === sen.id && sen.id === p.guideTarget) cls += ' picked';
          else if(picked === sen.id) cls += ' wrong-pick';
          return `<span class="${cls}" onclick="proofPick('${key}','${sen.id}')">${sen.text}</span>`;
        }).join(' ')}
      </div>
    </div>
    ${s.submitted ? gogiBubble(correct?'celebrate':'neutral', correct?p.guideRightGogi:p.guideWrongGogi) : ''}
    <div class="action-row">
      ${s.submitted && !correct ? `<button class="btn-ghost" onclick="retryProof('${key}')">Try a different sentence</button>` : (correct ? `<button class="btn btn-green">I've got it →</button>` : '')}
    </div>`;
}

window.cewPickE = (key, id) => { ls[key].eid = id; render(); };
window.cewPickW = (key, id) => { ls[key].wid = id; render(); };
window.submitCEW = key => { ls[key].submitted = true; render(); };
window.retryCEW = key => { ls[key].eid = null; ls[key].wid = null; ls[key].submitted = false; render(); };

function renderPart3_cewBuild(p){
  const key = p.classification;
  const s = ls[key];
  const ec = p.guideEvidenceChips.find(c => c.id === s.eid);
  const wc = p.guideWarrantChips.find(c => c.id === s.wid);
  const done = ec && wc;
  const correct = done && ec.correct && wc.correct;
  return `
    <div class="passage"><div class="passage-title">${p.passageTitle} — different moment</div>${p.guidePassage}</div>
    <div class="prompt">${p.guidePrompt}</div>
    <div class="diag-cew">
      <div class="cew-box filled"><div class="cew-lab">Claim</div><div class="cew-content">${p.guideClaim}</div></div>
      <div class="cew-arrow">↓</div>
      <div class="cew-box ${ec?'filled':''}"><div class="cew-lab">Evidence</div><div class="cew-content">${ec?ec.text:'<em style="color:var(--c-gray);">tap an evidence chip below</em>'}</div></div>
      <div class="cew-arrow">↓</div>
      <div class="cew-box ${wc?'filled':''}"><div class="cew-lab">Warrant</div><div class="cew-content">${wc?wc.text:'<em style="color:var(--c-gray);">tap a warrant chip below</em>'}</div></div>
    </div>
    <div style="font-size:10.5px;color:var(--c-gray);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px;">Evidence chips</div>
    <div class="chip-bank">${p.guideEvidenceChips.map(c => `<div class="chip ${s.eid===c.id?'used':''}" onclick="cewPickE('${key}','${c.id}')">${c.text}</div>`).join('')}</div>
    <div style="font-size:10.5px;color:var(--c-gray);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin:14px 0 6px;">Warrant chips</div>
    <div class="chip-bank">${p.guideWarrantChips.map(c => `<div class="chip ${s.wid===c.id?'used':''}" onclick="cewPickW('${key}','${c.id}')">${c.text}</div>`).join('')}</div>
    ${s.submitted ? gogiBubble(correct?'celebrate':'neutral', correct?p.guideRightGogi:p.guideWrongGogi) : ''}
    <div class="action-row">
      ${!s.submitted ? `<button class="btn" ${!done?'disabled':''} onclick="submitCEW('${key}')">Build the argument</button>` : (correct ? `<button class="btn btn-green">I've got it →</button>` : `<button class="btn-ghost" onclick="retryCEW('${key}')">Reset</button>`)}
    </div>`;
}

window.soapLens = (key, lensId) => { ls[key].lens = lensId; render(); };
window.soapTag = (key, sentIdx) => {
  const s = ls[key]; if(!s.lens || s.submitted) return;
  s.tags = s.tags || {}; s.tags[sentIdx] = s.lens;
  render();
};
window.submitSoap = key => { ls[key].submitted = true; render(); };
window.retrySoap = key => { ls[key].lens = null; ls[key].tags = {}; ls[key].submitted = false; render(); };

function renderPart3_soapInteractive(p){
  const key = p.classification;
  const s = ls[key];
  const tags = s.tags || {};
  const need = p.guideLenses.length;
  const doneCount = Object.keys(tags).length;
  const done = doneCount >= need;
  const allRight = done && p.guideLenses.every(L => tags[L.sentIdx] === L.id);
  return `
    <div class="prompt" style="margin-top:8px;">${p.guidePrompt}</div>
    <div class="diag-soap">
      <div class="lens-bar">
        ${p.guideLenses.map(L => `<div class="lens ${s.lens===L.id?'active':''}" onclick="soapLens('${key}','${L.id}')">${L.label}<span class="lens-full">${L.full}</span></div>`).join('')}
      </div>
      <div class="soap-passage">
        ${p.guideSentences.map(sen => {
          const tag = tags[sen.idx];
          let cls = 'soap-sent';
          if(tag){
            const L = p.guideLenses.find(LL => LL.id === tag);
            if(s.submitted && L && L.sentIdx === sen.idx) cls += ' tagged-right';
            else cls += ' tagged';
          }
          return `<span class="${cls}" data-tag="${tag||''}" onclick="soapTag('${key}',${sen.idx})">${sen.text}</span>`;
        }).join(' ')}
      </div>
    </div>
    ${s.submitted ? gogiBubble(allRight?'celebrate':'neutral', allRight?p.guideRightGogi:p.guideWrongGogi) : ''}
    <div class="action-row">
      ${!s.submitted ? `<button class="btn" ${!done?'disabled':''} onclick="submitSoap('${key}')">Check my tags</button>` : (allRight ? `<button class="btn btn-green">I've got it →</button>` : `<button class="btn-ghost" onclick="retrySoap('${key}')">Reset</button>`)}
    </div>`;
}

// ============================================================================
// ROUTER FOR PART 3
// ============================================================================
function renderPart3(p){
  switch(p.guideType){
    case 'chip-stem':        return renderPart3_chipStem(p);
    case 'predict-pick':     return renderPart3_predictPick(p);
    case 'frayer-fill':      return renderPart3_frayerFill(p);
    case 'split-fill':       return renderPart3_splitFill(p);
    case 'strip-interactive':return renderPart3_stripInteractive(p);
    case 'tag-interactive':  return renderPart3_tagInteractive(p);
    case 'mood-pick':        return renderPart3_moodPick(p);
    case 'tone-pick':        return renderPart3_tonePick(p);
    case 'pair-label':       return renderPart3_pairLabel(p);
    case 'bin-sort':         return renderPart3_binSort(p);
    case 'proof-pick':       return renderPart3_proofPick(p);
    case 'cew-build':        return renderPart3_cewBuild(p);
    case 'soap-interactive': return renderPart3_soapInteractive(p);
  }
}

// ============================================================================
// MAIN RENDER
// ============================================================================
function render(){
  const p = PATTERNS[current];
  const idx = ORDER.indexOf(current);
  document.getElementById('counter').textContent = `${idx+1} / ${ORDER.length}`;
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === ORDER.length - 1;
  document.getElementById('selector').value = current;

  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="route-line">
      <div class="route-code">route: <b>${p.route}</b></div>
      <div class="gap-badge">classification: <b>${p.classification}</b></div>
    </div>

    <!-- Part 1 -->
    <div class="card">
      ${cardHeader(p, 'Intervention — Learn the move')}
      <div class="lesson-stage">Part 1 of 3 · The move</div>
      <h2 class="lesson-title">${p.moveName}</h2>
      <p class="lesson-body">${p.partOneBody}</p>
      <div class="strategy-name">${p.moveShort}</div>
      ${renderPartOneDiagram(p)}
      <p class="lesson-body" style="margin-top:14px;">${p.partOneBottom}</p>
    </div>

    <!-- Part 2 -->
    <div class="card">
      <div class="lesson-stage">Part 2 of 3 · Watch me do it</div>
      <h2 class="lesson-title">One worked example</h2>
      <div class="passage"><div class="passage-title">${p.passageTitle}</div>${p.modelPassage}</div>
      ${gogiBubble('engaged', p.modelThinkAloud)}
      <div style="margin-top:14px;">${renderModelDiagram(p)}</div>
    </div>

    <!-- Part 3 -->
    <div class="card">
      <div class="lesson-stage">Part 3 of 3 · Try it with me</div>
      <h2 class="lesson-title">Your turn — same story, different moment</h2>
      ${renderPart3(p)}
    </div>
  `;
  window.scrollTo(0, 0);
}

// Selector + nav
selector.addEventListener('change', e => { current = e.target.value; render(); });
document.getElementById('prev').addEventListener('click', () => { const i = ORDER.indexOf(current); if(i>0){ current = ORDER[i-1]; render(); } });
document.getElementById('next').addEventListener('click', () => { const i = ORDER.indexOf(current); if(i<ORDER.length-1){ current = ORDER[i+1]; render(); } });

render();
</script>
